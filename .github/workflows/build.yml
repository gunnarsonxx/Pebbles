name: Build Pebbles

# Builds the Android app (APK) and the Windows installer on every push, and
# publishes both on the repository's Releases page so you can download them.
on:
  push:
    branches: [main, 'claude/**']
    paths-ignore: ['**.md']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  android:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      # keeps Gradle and the Android libraries between builds, so Maven hiccups can't break one
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - run: npm run build
      - run: npx cap sync android
      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          # Maven Central / Google's repository sometimes drop a download: retry each file, then the build
          RETRY="-Dorg.gradle.internal.http.connectionTimeout=60000 -Dorg.gradle.internal.http.socketTimeout=60000 -Dorg.gradle.internal.repository.max.retries=6 -Dorg.gradle.internal.repository.initial.backoff=2000"
          for attempt in 1 2 3; do
            if ./gradlew assembleRelease --no-daemon --stacktrace $RETRY; then exit 0; fi
            echo "Build attempt $attempt failed; trying again in 30 seconds"
            sleep 30
          done
          exit 1
      - run: cp android/app/build/outputs/apk/release/app-release.apk Pebbles.apk
      # the Community edition: no built-in keys, its own app id and name so it installs beside the personal one
      - name: Build Community APK
        env:
          VITE_EDITION: community
        run: |
          npm run build
          sed -i 's/applicationId "app.pebbles.money"/applicationId "app.pebbles.community"/' android/app/build.gradle
          sed -i 's#<string name="app_name">Pebbles</string>#<string name="app_name">Pebbles Community</string>#; s#<string name="title_activity_main">Pebbles</string>#<string name="title_activity_main">Pebbles Community</string>#' android/app/src/main/res/values/strings.xml
          npx cap sync android
          cd android
          RETRY="-Dorg.gradle.internal.http.connectionTimeout=60000 -Dorg.gradle.internal.http.socketTimeout=60000 -Dorg.gradle.internal.repository.max.retries=6 -Dorg.gradle.internal.repository.initial.backoff=2000"
          ok=0
          for attempt in 1 2 3; do
            if ./gradlew assembleRelease --no-daemon --stacktrace $RETRY; then ok=1; break; fi
            sleep 30
          done
          [ $ok = 1 ]
          cp app/build/outputs/apk/release/app-release.apk ../Pebbles-Community.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Pebbles-android
          path: |
            Pebbles.apk
            Pebbles-Community.apk

  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Stamp version
        shell: bash
        run: npm version "1.0.${{ github.run_number }}" --no-git-tag-version --allow-same-version
      - run: npm run desktop:dist
      - name: Collect installer
        shell: bash
        run: cp release/Pebbles-Setup-*.exe Pebbles-Setup.exe
      - name: Build Community installer
        shell: bash
        env:
          VITE_EDITION: community
        run: |
          npm run build
          npm run desktop:build
          npx electron-builder --win --publish never -c.appId=app.pebbles.community -c.productName="Pebbles Community" -c.extraMetadata.productName="Pebbles Community" -c.extraMetadata.name=pebbles-community -c.nsis.shortcutName="Pebbles Community" '-c.win.artifactName=Pebbles-Community-Setup-${version}.exe'
          cp release/Pebbles-Community-Setup-*.exe Pebbles-Community-Setup.exe
      - uses: actions/upload-artifact@v4
        with:
          name: Pebbles-windows
          path: |
            Pebbles-Setup.exe
            Pebbles-Community-Setup.exe

  release:
    needs: [android, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: Pebbles build ${{ github.run_number }}
          prerelease: ${{ github.ref != 'refs/heads/main' }}
          make_latest: ${{ github.ref == 'refs/heads/main' }}
          body: |
            ## Not the owner? Download the **Community** files
            **Pebbles Community** is the version for everyone else: no one else's keys are built in, and setup walks you through your own state, store and bank. It installs as its own app with its own data, and only updates to newer Community files.
            - **Android:** `Pebbles-Community.apk`
            - **Windows:** `Pebbles-Community-Setup.exe`

            Setup guide: https://github.com/gunnarsonxx/Pebbles/blob/${{ github.sha }}/COMMUNITY.md

            ## Owner's personal build
            `Pebbles.apk` and `Pebbles-Setup.exe` are set up for one person. Please use the Community files above instead.

            **Installing:** on Android, open the APK and allow installing from your browser or Files app when asked. On Windows, if SmartScreen appears, choose *More info → Run anyway* (the app isn't code-signed).

            Built from `${{ github.ref_name }}` at ${{ github.sha }}.
          files: |
            out/Pebbles.apk
            out/Pebbles-Setup.exe
            out/Pebbles-Community.apk
            out/Pebbles-Community-Setup.exe
